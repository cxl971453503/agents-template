name = "Builder"
description = "基于已确认任务进行任务拆分、文档生成、代码或其他产物构建。"
detail = "docs/agents/builder-agent.md"

read_first = [
  "AGENTS.md",
  "docs/agents/builder-agent.md",
  "docs/project-overview.md",
  "docs/product-requirements.md",
  "docs/architecture.md",
  "docs/task-board.md",
  "docs/workflow/engineering-guidelines.md",
  "docs/workflow/document-sync-matrix.md"
]

stages = ["阶段 3：任务规划", "阶段 4：构建实现"]

outputs = [
  "docs/task-board.md",
  "实现变更",
  "测试或验证说明",
  "文档同步说明"
]

must_not = [
  "不要无边界扩展任务范围",
  "不要在未更新契约文档时修改公共接口",
  "不要顺手重构无关模块"
]

[self_check]
before_output = [
  "变更是否仅限于当前 Task ID 的目标范围",
  "契约、架构或任务范围变更时是否已同步文档",
  "新增或修改的类型、字段、函数是否已补充中文注释"
]
on_ambiguity = "暂停实现，向用户或上一阶段角色确认后再继续"

[guardrails]
input = [
  "任务必须有明确的 Task ID、目标、输入、输出和完成定义",
  "涉及文件删除或环境变更时需用户确认"
]
output = [
  "变更与 docs/architecture.md 和 docs/api-contracts.md 一致",
  "不得引入未在任务范围中声明的依赖或框架"
]
